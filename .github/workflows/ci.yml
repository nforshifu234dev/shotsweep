name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    # The capture tests drive a real Chromium, and most users run on Windows,
    # where path-separator bugs live — so test on both.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Keep Playwright's browser download inside the workspace so one cache
      # path works on every OS (the defaults differ per platform).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Restore BEFORE `npm ci`: the package's postinstall downloads Chromium,
      # and with a warm cache it finds the browser already there and skips it.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Downloads are skipped when cached; --with-deps still installs the
      # system libraries Chromium needs on Linux.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm test

  # The "Protect main" ruleset requires a check named exactly `build`. A matrix
  # renames its jobs ("test (ubuntu-latest)", ...), so this gate job keeps the
  # required name stable and only passes when every matrix leg passed.
  build:
    name: build
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs must pass
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi